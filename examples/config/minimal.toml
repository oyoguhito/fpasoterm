# Minimal fpasoterm config example.
# Copy this to ~/.config/fpasoterm/User/config.toml and edit as needed.

[window]
title = "fpasoterm"
width = 1000
height = 680
titlebarColor = "#1565c0"

[terminal]
fontSize = 14
lineHeight = 1.12
minimumContrastRatio = 4.5
rescaleOverlappingGlyphs = true
backgroundOpacity = 0.8
fontFamily = "\"Noto Sans Mono CJK JP\", \"Noto Sans CJK JP\", \"BIZ UDGothic\", \"Hiragino Sans\", Meiryo, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
termName = "xterm-256color"
# Leave empty for the platform default shell.
# Windows examples: "powershell.exe", "pwsh.exe", or "cmd.exe".
shell = ""

[ime]
duplicateGuard = true
duplicateWindowMs = 800
repeatedTextWindowMs = 140

[keybindings]
prefix = "Mod+Shift"
newWindow = "N"
tile = "T"

[plugins]
enabled = []
