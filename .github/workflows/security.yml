name: Security

on:
  push:
    branches:
      - main
      - fpasoterm
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  dependency-security:
    name: Secret and vulnerability checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for committed secrets
        run: npm run scan:secrets

      - name: Audit production dependencies
        shell: bash
        run: |
          set -o pipefail

          # npm's audit API is external to this workflow. Retry transient
          # registry failures, but fail immediately when an audit finds a
          # dependency vulnerability.
          for attempt in 1 2 3; do
            if npm audit --omit=dev 2>&1 | tee /tmp/npm-audit.log; then
              exit 0
            fi

            if grep -Eq 'This endpoint is being retired|Invalid package tree|audit endpoint returned an error' /tmp/npm-audit.log; then
              echo 'warning: npm audit API could not evaluate this lockfile; CodeQL and Rust dependency audit still ran.'
              exit 0
            fi

            if ! grep -Eq 'Service Unavailable|EAI_AGAIN|ECONNRESET|ETIMEDOUT' /tmp/npm-audit.log; then
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              echo 'warning: npm audit API remained unavailable after retries; CodeQL and Rust dependency audit still ran.'
              exit 0
            fi

            sleep "$((attempt * 15))"
          done

  security:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  codeql-rust:
    name: CodeQL Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  rust-dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
